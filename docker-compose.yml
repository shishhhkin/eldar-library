services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${postgres_user}
      POSTGRES_DB: ${postgres_db}
      POSTGRES_PASSWORD: ${postgres_password}
    ports:
      - "${postgres_port}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${postgres_user} -d ${postgres_db}"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file: .env
    environment:
      postgres_host: postgres
      postgres_port: 5432
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"

  subscriber:
    build: .
    env_file: .env
    command: ["python", "-m", "src.subscriber"]
    restart: unless-stopped
    environment:
      postgres_host: postgres
      postgres_port: 5432
      kafka_bootstrap_servers: host.docker.internal:29092
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "src.subscriber", "healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
